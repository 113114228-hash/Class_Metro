<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>慈濟大學</title>
<!--
  ==========================================================================
  METRO CONTROL CENTER DASHBOARD  ·  Hollywood film prop (fictional data)
  --------------------------------------------------------------------------
  • One self-contained file: HTML + CSS + JavaScript. No server, no
    database, no external files or libraries. Double-click to open.
  • Bilingual: English / Traditional Chinese (繁體中文).
    Use the EN / 繁中 switch, press L, or open the file with #zh at the end
    of the address to start in Chinese.
  • Keyboard: F fullscreen · P pause · E emergency on/off · L language
              0 all lines · 1–4 single line · N next train
  • All metro data is fictional and generated by JavaScript.
  ==========================================================================
-->
<style>
/* ======================================================================
   1. DESIGN TOKENS
   Chrome is steel-blue and quiet; saturated colour always means
   something: either a metro line's identity or an operating status.
   ====================================================================== */
:root{
  --bg:#050b14;
  --panel:rgba(9,20,36,.78);
  --edge:#16304f;
  --edge-hi:#26507e;
  --steel:#7fb4e6;
  --text:#d3e4f7;
  --dim:#6d88aa;
  --faint:#34506f;

  --ok:#33ff99;
  --warn:#ffb020;
  --crit:#ff3355;
  --info:#5fc8ff;

  --lA:#22d3ff; --lB:#ff4fd1; --lC:#a8f04a; --lD:#6b8cff;

  --mono:"SF Mono","Cascadia Mono","Consolas","Menlo","Roboto Mono","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",monospace;
  --sans:"Segoe UI","Helvetica Neue",Arial,"PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",sans-serif;
}

/* ======================================================================
   2. BASE
   ====================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(11px,.72vw,17px)}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit}
button:focus-visible{outline:2px solid var(--steel);outline-offset:2px}

/* faint CRT scanlines + vignette (static, cheap) */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 1px,transparent 1px 3px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:61;
  background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.5) 100%)}

.app{
  height:100vh;height:100dvh;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:.55rem;padding:.55rem;
  background:
    radial-gradient(1200px 520px at 50% -12%,rgba(40,120,210,.13),transparent 62%),
    radial-gradient(900px 420px at 50% 112%,rgba(40,160,230,.07),transparent 60%),
    var(--bg);
}
/* red frame that breathes during an emergency */
.app::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40}
body.emergency .app::after{animation:emFrame 1.6s ease-in-out infinite}
@keyframes emFrame{
  0%,100%{box-shadow:inset 0 0 0 2px rgba(255,51,85,.45),inset 0 0 50px rgba(255,51,85,.12)}
  50%{box-shadow:inset 0 0 0 3px rgba(255,51,85,.95),inset 0 0 120px rgba(255,51,85,.28)}
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.dot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:currentColor;
  box-shadow:0 0 7px currentColor;flex:none;animation:pulse 2s ease-in-out infinite}

/* ======================================================================
   3. HEADER
   ====================================================================== */
.top{
  display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:1.5rem;
  padding:.5rem 1rem;border:1px solid var(--edge);position:relative;
  background:linear-gradient(180deg,rgba(15,32,58,.92),rgba(7,15,28,.92));
}
.top::after{content:"";position:absolute;left:8%;right:8%;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--steel),transparent);opacity:.7}
.brand{display:flex;align-items:center;gap:.85rem;min-width:0}
.logo{width:2.7rem;height:2.7rem;flex:none}
.brand-title{font-size:1.4rem;font-weight:700;letter-spacing:.13em;color:#eef6ff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 14px rgba(95,200,255,.35)}
body.zh .brand-title{letter-spacing:.24em}
.brand-sub{display:flex;align-items:center;gap:.7rem;margin-top:.2rem;font-family:var(--mono);
  font-size:.7rem;letter-spacing:.12em;color:var(--dim);white-space:nowrap;overflow:hidden}
.sim-tag{padding:.05rem .45rem;border:1px solid rgba(255,176,32,.45);color:var(--warn);border-radius:2px}

.global{display:flex;flex-direction:column;align-items:center;gap:.3rem}
.gstatus{display:flex;align-items:center;gap:.6rem;padding:.42rem 1.1rem;border:1px solid;border-radius:2px;
  font-family:var(--mono);font-weight:700;font-size:.95rem;letter-spacing:.14em;white-space:nowrap;transition:.3s}
.gstatus.ok{color:var(--ok);border-color:rgba(51,255,153,.4);background:rgba(51,255,153,.06)}
.gstatus.warn{color:var(--warn);border-color:rgba(255,176,32,.5);background:rgba(255,176,32,.08)}
.gstatus.crit{color:#fff;border-color:var(--crit);background:rgba(255,51,85,.25);animation:gCrit 1.2s ease-in-out infinite}
.gstatus.crit .dot{color:var(--crit)}
@keyframes gCrit{50%{background:rgba(255,51,85,.5);box-shadow:0 0 22px rgba(255,51,85,.55)}}
.gmeta{display:flex;gap:1.1rem;font-family:var(--mono);font-size:.68rem;color:var(--dim);letter-spacing:.08em;white-space:nowrap}
.gmeta b{color:var(--text);font-weight:600}

.clockbox{text-align:right}
.clock{font-family:var(--mono);font-size:2.35rem;font-weight:700;line-height:1;letter-spacing:.05em;
  color:#eef8ff;text-shadow:0 0 16px rgba(95,200,255,.5);font-variant-numeric:tabular-nums}
.date{font-family:var(--mono);font-size:.7rem;color:var(--dim);letter-spacing:.12em;margin-top:.3rem;white-space:nowrap}

.controls{display:flex;gap:.4rem;align-items:center}
.btn{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;color:var(--text);cursor:pointer;
  background:rgba(127,180,230,.06);border:1px solid var(--edge-hi);padding:.5rem .7rem;border-radius:2px;
  white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:rgba(127,180,230,.16);border-color:var(--steel);color:#fff}
.btn.on{background:rgba(95,200,255,.18);border-color:var(--info);color:#fff}
.btn.danger{border-color:rgba(255,51,85,.6);color:#ff8a9d;background:rgba(255,51,85,.08)}
.btn.danger:hover,.btn.danger.on{background:rgba(255,51,85,.28);color:#fff;border-color:var(--crit)}
.seg{display:flex;border:1px solid var(--edge-hi);border-radius:2px;overflow:hidden}
.seg button{font-family:var(--mono);font-size:.74rem;font-weight:700;padding:.5rem .6rem;border:0;cursor:pointer;
  background:transparent;color:var(--dim);letter-spacing:.06em}
.seg button.on{background:var(--info);color:#03101c}
.seg button:not(.on):hover{color:#fff;background:rgba(127,180,230,.14)}

/* ======================================================================
   4. MAIN GRID + PANELS
   ====================================================================== */
.grid{display:grid;grid-template-columns:minmax(250px,23fr) minmax(0,54fr) minmax(270px,23fr);gap:.55rem;min-height:0}
.col{display:flex;flex-direction:column;gap:.55rem;min-height:0;min-width:0}

.panel{position:relative;display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--edge)}
.panel.grow{flex:1 1 0}
/* corner brackets */
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none}
.panel::before{top:-1px;left:-1px;border-top:2px solid var(--steel);border-left:2px solid var(--steel)}
.panel::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--steel);border-right:2px solid var(--steel)}

.ph{flex:none;display:flex;align-items:center;gap:.55rem;padding:.42rem .7rem;border-bottom:1px solid var(--edge);
  font-size:.78rem;font-weight:700;letter-spacing:.15em;color:#c4dcf5;
  background:linear-gradient(90deg,rgba(127,180,230,.09),transparent 70%)}
.ph::before{content:"";width:3px;height:.9rem;background:var(--steel)}
.ph-r{margin-left:auto;font-family:var(--mono);font-size:.64rem;font-weight:500;letter-spacing:.08em;color:var(--dim);white-space:nowrap}
.ph-r.live{color:var(--ok);display:flex;align-items:center;gap:.35rem}
.ph-r.live .dot{width:.42rem;height:.42rem}
.pb{flex:1 1 auto;min-height:0;padding:.55rem .7rem}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--edge-hi) transparent}
.scroll::-webkit-scrollbar{width:4px}
.scroll::-webkit-scrollbar-thumb{background:var(--edge-hi)}

.sub-h{display:flex;align-items:center;gap:.5rem;margin:.55rem 0 .3rem;font-family:var(--mono);font-size:.62rem;
  letter-spacing:.16em;color:var(--dim)}
.sub-h::after{content:"";flex:1;height:1px;background:var(--edge)}

.st{display:inline-flex;align-items:center;gap:.35rem;font-family:var(--mono);font-size:.66rem;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.st .dot{width:.45rem;height:.45rem}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.crit{color:var(--crit)} .st.info{color:var(--info)}
.st.crit .dot{animation-duration:.8s}
.st.ok .dot{animation:none}

/* ---- system status ---- */
.health{display:flex;align-items:center;gap:.9rem}
.gauge-box{position:relative;width:5.2rem;height:5.2rem;flex:none}
.gauge{width:100%;height:100%;transform:rotate(-90deg)}
.g-bg{fill:none;stroke:#10233d;stroke-width:7}
.g-tick{fill:none;stroke:rgba(127,180,230,.25);stroke-width:1;stroke-dasharray:1 5.6}
.g-fg{fill:none;stroke:var(--ok);stroke-width:7;stroke-linecap:round;stroke-dasharray:263.9;
  transition:stroke-dashoffset .9s ease,stroke .4s}
.gauge-val{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:1.85rem;
  font-family:var(--mono);font-size:1.25rem;font-weight:700;color:#eef8ff}
.gauge-val small{font-size:.6rem;color:var(--dim);margin-left:.1rem}
.health-meta{flex:1;min-width:0}
.health-meta .lbl{font-size:.72rem;font-weight:700;letter-spacing:.12em;color:#c4dcf5;margin-bottom:.3rem}
.hm-row{display:flex;justify-content:space-between;gap:.5rem;padding:.12rem 0;font-family:var(--mono);font-size:.66rem;color:var(--dim)}
.hm-row b{color:var(--text);font-weight:600}

.ls-row{display:grid;grid-template-columns:.28rem minmax(0,1fr) auto;align-items:center;gap:.55rem;padding:.28rem 0;
  border-bottom:1px dashed rgba(38,80,126,.35)}
.ls-row:last-child{border-bottom:0}
.ls-bar{height:1.7rem;border-radius:1px;box-shadow:0 0 8px currentColor}
.ls-name{font-size:.76rem;font-weight:700;letter-spacing:.07em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls-sub{font-family:var(--mono);font-size:.6rem;color:var(--dim);margin-top:.1rem;white-space:nowrap}
.ls-row.crit{background:linear-gradient(90deg,rgba(255,51,85,.16),transparent)}
.ls-row.warn{background:linear-gradient(90deg,rgba(255,176,32,.1),transparent)}

.subsys{display:grid;grid-template-columns:1fr;gap:.1rem}
.ss{display:flex;align-items:center;gap:.5rem;padding:.16rem 0;font-size:.7rem}
.ss .dot{width:.42rem;height:.42rem}
.ss.ok .dot{color:var(--ok);animation:none}
.ss.warn .dot{color:var(--warn)}
.ss.crit .dot{color:var(--crit);animation-duration:.7s}
.ss-name{flex:1;min-width:0;color:#b6cfe9;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-val{font-family:var(--mono);font-size:.64rem;color:var(--dim);white-space:nowrap}
.ss.warn .ss-val{color:var(--warn)} .ss.crit .ss-val{color:var(--crit)}

/* ---- train monitor ---- */
.tr{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;column-gap:.5rem;row-gap:.16rem;align-items:center;
  margin-bottom:.26rem;padding:.36rem .5rem;cursor:pointer;background:rgba(10,24,44,.6);
  border:1px solid transparent;border-left:3px solid var(--lc);transition:background .15s,border-color .15s}
.tr:hover{background:rgba(127,180,230,.1)}
.tr.sel{background:rgba(95,200,255,.13);border-color:rgba(95,200,255,.55);border-left-color:var(--lc)}
.tr.hide{display:none}
.tr-id{font-family:var(--mono);font-size:.82rem;font-weight:700;color:#eef8ff}
.chip{font-family:var(--mono);font-size:.58rem;font-weight:800;padding:.04rem .3rem;border-radius:2px;color:#03101c;background:var(--lc)}
.tr .st{justify-self:start;overflow:hidden}
.tr-spd{font-family:var(--mono);font-size:.8rem;text-align:right;color:#e2f1ff;white-space:nowrap;font-variant-numeric:tabular-nums}
.tr-spd small{font-size:.54rem;color:var(--dim);margin-left:.15rem}
.tr-route{grid-column:1/4;font-size:.64rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-route em{font-style:normal;color:var(--steel);margin:0 .2rem}
.tr-meta{display:flex;align-items:center;gap:.4rem;justify-content:flex-end;font-family:var(--mono);font-size:.6rem;color:var(--dim)}
.tr-meta .dl.late{color:var(--warn)}
.lb{position:relative;display:inline-block;width:2.6rem;height:.28rem;background:#10233d;overflow:hidden}
.lb i{position:absolute;inset:0 auto 0 0;background:var(--ok);transition:width .8s}
.lb.warn i{background:var(--warn)} .lb.crit i{background:var(--crit)}

/* ---- network map ---- */
.filters{margin-left:auto;display:flex;gap:.3rem}
.fbtn{font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.06em;padding:.22rem .55rem;cursor:pointer;
  color:var(--dim);background:transparent;border:1px solid var(--edge-hi);border-radius:2px;white-space:nowrap}
.fbtn:hover{color:#fff;border-color:var(--fc,var(--steel))}
.fbtn.on{color:#03101c;background:var(--fc,var(--steel));border-color:var(--fc,var(--steel))}

.map-wrap{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 45%,rgba(30,100,170,.16),transparent 70%)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
.scan{position:absolute;left:0;right:0;top:0;height:16%;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(95,200,255,.05) 80%,rgba(95,200,255,.16));
  border-bottom:1px solid rgba(95,200,255,.22);animation:scan 8s linear infinite}
@keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(640%)}}

.ln,.ln-glow,.ln-flow{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke-width:6}
.ln-glow{stroke-width:17;stroke-opacity:.13}
.ln-flow{stroke:#fff;stroke-opacity:.5;stroke-width:1.3;stroke-dasharray:2 22;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.line-g{transition:opacity .35s}
.line-g.dim{opacity:.1}
.line-g.crit .ln-flow{stroke:var(--crit);stroke-opacity:.9;stroke-width:2;animation-duration:.6s}
.term rect{rx:3px}
.term text{font-family:var(--mono);font-size:10px;font-weight:800;fill:#03101c;text-anchor:middle}
.stn{fill:#050b14;stroke-width:2.6}
.stn-x{fill:#eef6ff;stroke:#050b14;stroke-width:2.4}
.stn-x-ring{fill:none;stroke:#eef6ff;stroke-opacity:.3;stroke-width:1}
.stn-lbl{font-family:var(--sans);font-size:10.5px;letter-spacing:.05em;fill:#94b4d8;
  paint-order:stroke;stroke:#050b14;stroke-width:3px;stroke-linejoin:round}
.stn-lbl.x{fill:#eef6ff;font-weight:700;font-size:11.5px}
body.zh .stn-lbl{font-size:12px} body.zh .stn-lbl.x{font-size:13px}
.sector{font-family:var(--mono);font-size:9px;letter-spacing:.2em;fill:#2f5a8a}
.water{fill:rgba(20,110,190,.07);stroke:rgba(60,160,240,.2);stroke-dasharray:4 6}

.train{cursor:pointer}
.train .halo{opacity:.26}
.train .core{stroke:#fff;stroke-width:1.5}
.train .ring{fill:none;stroke:#fff;stroke-width:1.4;opacity:0;transform-box:fill-box;transform-origin:center}
.train.sel .ring{animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.9);opacity:0}}
.train text{font-family:var(--mono);font-size:8.5px;fill:#b9d3ee;paint-order:stroke;stroke:#050b14;stroke-width:2.6px}
.train text{display:none}
.train.sel text,.train.lbl text{display:inline}
.train.sel text{fill:#fff;font-weight:700;font-size:10px}
.train.hold .core{fill:var(--crit)}
.train.dim{opacity:.1}

.em-wave{fill:none;stroke:var(--crit);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:emWave 1.6s ease-out infinite}
.em-wave.w2{animation-delay:.8s}
@keyframes emWave{0%{transform:scale(.6);opacity:1}100%{transform:scale(3);opacity:0}}
.em-core{fill:var(--crit);stroke:#fff;stroke-width:1.5}
.em-x{font-family:var(--mono);font-size:11px;font-weight:800;fill:#fff;text-anchor:middle}
.em-seg{stroke:var(--crit);stroke-width:9;stroke-linecap:round;fill:none;animation:pulse 1s ease-in-out infinite}

.map-info{position:absolute;top:.55rem;left:.7rem;font-family:var(--mono);font-size:.64rem;line-height:1.7;
  color:var(--dim);letter-spacing:.06em;pointer-events:none}
.map-info b{color:var(--text)}
.em-banner{position:absolute;top:.55rem;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:.7rem;
  max-width:70%;padding:.45rem 1rem;background:rgba(44,4,14,.92);border:1px solid var(--crit);
  color:#ffd6de;font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;white-space:nowrap;
  box-shadow:0 0 26px rgba(255,51,85,.45);animation:gCrit 1.4s ease-in-out infinite}
.em-banner b{color:#fff;letter-spacing:.14em}
.em-banner .em-d{overflow:hidden;text-overflow:ellipsis}
body.emergency .em-banner{display:flex}
.paused-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;padding:.5rem 1.4rem;
  border:1px solid var(--warn);background:rgba(30,20,0,.85);color:var(--warn);font-family:var(--mono);
  font-size:1.2rem;font-weight:700;letter-spacing:.3em}
body.paused .paused-badge{display:block}

.detail{position:absolute;left:.6rem;bottom:.6rem;width:17.5rem;padding:.55rem .75rem;
  background:rgba(5,12,24,.9);border:1px solid var(--edge-hi);border-left:3px solid var(--lc,var(--steel));
  font-family:var(--mono);font-size:.7rem}
.d-h{display:flex;justify-content:space-between;align-items:center;font-size:.6rem;letter-spacing:.14em;color:var(--dim)}
.d-id{font-size:1.45rem;font-weight:700;color:#fff;letter-spacing:.05em;margin:.05rem 0 .35rem;text-shadow:0 0 12px var(--lc)}
.d-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.17rem .8rem}
.d-grid>span{color:var(--dim);white-space:nowrap}
.d-grid>b{color:#e6f2ff;font-weight:600;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-grid>b.st{justify-content:flex-end}
.spd-bar{position:relative;height:.3rem;margin-top:.5rem;background:#10233d;overflow:hidden}
.spd-bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--lc,var(--steel)),#fff);transition:width .25s}

.legend{position:absolute;right:.6rem;bottom:.6rem;display:flex;flex-direction:column;gap:.22rem;padding:.45rem .6rem;
  background:rgba(5,12,24,.82);border:1px solid var(--edge);font-family:var(--mono);font-size:.6rem;color:var(--dim)}
.legend div{display:flex;align-items:center;gap:.45rem;white-space:nowrap}
.legend .sw{width:1.2rem;height:.3rem;border-radius:1px}

/* ---- alerts ---- */
.alerts{list-style:none;display:flex;flex-direction:column;gap:.3rem;height:100%;overflow:hidden}
.al{padding:.34rem .55rem;border-left:3px solid;background:rgba(10,24,44,.6);font-size:.72rem}
.al-h{display:flex;justify-content:space-between;gap:.5rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;margin-bottom:.12rem}
.al-h .lv{font-weight:800}
.al-h .tm{color:var(--dim)}
.al .msg{line-height:1.35;color:#d9e9fa;letter-spacing:.02em}
.al.info{border-color:var(--info)} .al.info .lv{color:var(--info)}
.al.warn{border-color:var(--warn);background:rgba(255,176,32,.07)} .al.warn .lv{color:var(--warn)}
.al.crit{border-color:var(--crit);background:rgba(255,51,85,.13);animation:alCrit 1.4s ease-in-out infinite}
.al.crit .lv{color:var(--crit)}
.al.new{animation:slideIn .45s ease-out}
.al.crit.new{animation:slideIn .45s ease-out,alCrit 1.4s ease-in-out .45s infinite}
.al:nth-child(n+7){opacity:.62}
@keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes alCrit{50%{background:rgba(255,51,85,.27)}}
.acount{display:flex;gap:.6rem}
.acount .c{color:var(--crit)} .acount .w{color:var(--warn)} .acount .i{color:var(--info)}

/* ---- operations data ---- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.32rem}
.stat{min-width:0;padding:.34rem .45rem;background:rgba(10,24,44,.62);border:1px solid rgba(38,80,126,.45)}
.stat .k{font-family:var(--mono);font-size:.53rem;letter-spacing:.07em;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{margin-top:.1rem;font-family:var(--mono);font-size:1.12rem;font-weight:700;color:#eef8ff;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat .v small{font-size:.58rem;font-weight:500;color:var(--dim);margin-left:.15rem}
.stat .bar{height:.2rem;margin-top:.22rem;background:#10233d;position:relative;overflow:hidden}
.stat .bar i{position:absolute;inset:0 auto 0 0;background:var(--ok);transition:width .8s,background .4s}
.stat .bar.warn i{background:var(--warn)} .stat .bar.crit i{background:var(--crit)}
.v[data-f="a"]{animation:flashA .7s ease-out}
.v[data-f="b"]{animation:flashB .7s ease-out}
@keyframes flashA{from{color:var(--info);text-shadow:0 0 10px var(--info)}}
@keyframes flashB{from{color:var(--info);text-shadow:0 0 10px var(--info)}}

.chart{margin-top:.5rem}
.chart-h{display:flex;justify-content:space-between;margin-bottom:.2rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;color:var(--dim)}
.chart-h b{font-weight:700}
.chart canvas{display:block;width:100%;height:3.5rem;background:rgba(4,10,20,.6);border:1px solid rgba(38,80,126,.45)}
.ll{display:grid;grid-template-columns:3.4rem minmax(0,1fr) 2.6rem;align-items:center;gap:.5rem;padding:.1rem 0;font-family:var(--mono);font-size:.64rem}
.ll .nm{font-weight:700;color:var(--lc);white-space:nowrap}
.ll .trk{position:relative;height:.38rem;background:#10233d;overflow:hidden}
.ll .trk i{position:absolute;inset:0 auto 0 0;background:var(--lc);box-shadow:0 0 8px var(--lc);transition:width .8s}
.ll .pc{text-align:right;color:var(--text)}

/* ======================================================================
   5. TICKER
   ====================================================================== */
.ticker{display:flex;align-items:stretch;min-width:0;height:2.3rem;border:1px solid var(--edge);background:rgba(5,12,24,.92);font-family:var(--mono)}
.tk-label{display:flex;align-items:center;gap:.45rem;padding:0 .9rem;border-right:1px solid var(--edge);
  background:rgba(95,200,255,.12);color:var(--info);font-size:.72rem;font-weight:700;letter-spacing:.14em;white-space:nowrap}
.tk-label .dot{width:.45rem;height:.45rem;color:var(--crit)}
.tk-window{flex:1;min-width:0;position:relative;overflow:hidden;display:flex;align-items:center;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.tk-track{display:inline-flex;white-space:nowrap;will-change:transform;animation:tick 60s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk-item{padding-right:3.4rem;font-size:.8rem;letter-spacing:.06em;color:#d3e4f7}
.tk-item::before{content:">> ";color:var(--info)}
.tk-item.w{color:var(--warn)} .tk-item.c{color:#ff8a9d}
.tk-item.c::before{color:var(--crit)}
.tk-keys{display:flex;align-items:center;padding:0 .9rem;border-left:1px solid var(--edge);font-size:.6rem;color:var(--dim);letter-spacing:.05em;white-space:nowrap}

body.paused .tk-track,body.paused .ln-flow,body.paused .scan{animation-play-state:paused}


/* ---- 3D city view ---- */
#city{position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none;cursor:grab}
#city.on{display:block}
#city.drag{cursor:grabbing}
body.view3d #map,body.view3d .scan{display:none}
.viewseg{display:flex;border:1px solid var(--edge-hi);border-radius:2px;overflow:hidden;margin-left:.45rem}
.viewseg button{font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.06em;padding:.22rem .55rem;
  border:0;cursor:pointer;background:transparent;color:var(--dim);white-space:nowrap}
.viewseg button.on{background:var(--steel);color:#03101c}
.viewseg button:not(.on):hover{color:#fff;background:rgba(127,180,230,.14)}
.hint3d{position:absolute;right:.7rem;bottom:.6rem;display:none;flex-direction:column;gap:.25rem;padding:.45rem .7rem;
  background:rgba(5,12,24,.85);border:1px solid var(--edge);font-family:var(--mono);font-size:.6rem;
  letter-spacing:.08em;color:var(--dim);pointer-events:none}
body.view3d .hint3d{display:flex}

body.view3d .legend{display:none}
.hint3d b{color:var(--steel);font-weight:700}
.follow-tag{position:absolute;top:.55rem;right:.7rem;display:none;align-items:center;gap:.45rem;padding:.3rem .7rem;
  border:1px solid var(--info);background:rgba(5,20,34,.9);color:var(--info);font-family:var(--mono);
  font-size:.66rem;letter-spacing:.12em}
body.follow.view3d .follow-tag{display:flex}
.threat-box{position:absolute;top:2.9rem;right:.7rem;display:none;flex-direction:column;gap:.2rem;padding:.4rem .65rem;
  border:1px solid rgba(255,176,32,.5);background:rgba(26,16,2,.88);font-family:var(--mono);font-size:.62rem;
  letter-spacing:.06em;color:var(--warn);max-width:18rem}
body.view3d .threat-box.on{display:flex}
body.follow.view3d .threat-box{top:5rem}
.threat-box .t-h{color:var(--dim);font-size:.56rem;letter-spacing:.14em}
.threat-box .t-i.crit{color:var(--crit)}

/* ---- scene mode: a clean screen for filming ---- */
html.scene{font-size:clamp(12px,.87vw,21px)}
body.scene{cursor:none}
body.scene .controls,body.scene .filters,body.scene .viewseg,body.scene .tk-keys,body.scene .gmeta,body.scene .legend,body.scene .hint3d{display:none}
.scene-hint{position:fixed;left:50%;bottom:3.4rem;transform:translateX(-50%);z-index:70;display:none;
  padding:.45rem 1.1rem;border:1px solid var(--edge-hi);background:rgba(5,12,24,.92);color:var(--dim);
  font-family:var(--mono);font-size:.72rem;letter-spacing:.12em}
body.scene .scene-hint{display:block;animation:hintFade 5s ease forwards}
@keyframes hintFade{0%,55%{opacity:1}100%{opacity:0}}

/* ---- story-beat (sequence) indicator ---- */
.beat{display:flex;align-items:center;gap:.45rem;margin-top:.35rem;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:var(--dim)}
.beat b{color:var(--steel);letter-spacing:.12em}
.beat .pips{display:flex;gap:.22rem;margin-left:.15rem}
.beat .pip{width:.55rem;height:.55rem;border:1px solid var(--edge-hi)}
.beat .pip.on{background:var(--steel);border-color:var(--steel)}
.beat .pip.on.hot{background:var(--warn);border-color:var(--warn)}
.beat .pip.on.max{background:var(--crit);border-color:var(--crit)}

/* ---- platform crowding strip (selected line) ---- */
.pd{flex:none;display:flex;align-items:flex-end;gap:.6rem;padding:.4rem .7rem .3rem;
  border-top:1px solid var(--edge);background:rgba(5,12,24,.55)}
.pd-h{flex:none;width:7.5rem;font-family:var(--mono);font-size:.58rem;letter-spacing:.08em;color:var(--dim);line-height:1.5}
.pd-h b{display:block;font-size:.7rem;color:var(--lc,var(--steel));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd-track{flex:1;min-width:0;display:flex;gap:.28rem;align-items:flex-end}
.pd-s{flex:1;min-width:0}
.pd-bar{position:relative;height:2.1rem;background:#0d1e33;overflow:hidden}
.pd-bar i{position:absolute;left:0;right:0;bottom:0;background:var(--lc);opacity:.8;transition:height .9s ease}
.pd-bar.warn i{background:var(--warn);opacity:.95}
.pd-bar.crit i{background:var(--crit);opacity:1}
.pd-n{margin-top:.18rem;font-size:.54rem;color:var(--dim);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ======================================================================
   6. RESPONSIVE (projectors / smaller monitors)
   ====================================================================== */
@media (max-width:1500px){ .tk-keys{display:none} }
@media (max-width:1300px){
  .gmeta{display:none}
  .brand-sub .sub-text{display:none}
  .btn{padding:.45rem .5rem}
  .detail{width:15rem}
}
@media (max-height:860px){
  .gauge-box{width:4.2rem;height:4.2rem}
  .gauge-val{padding-top:1.4rem;font-size:1.05rem}
  .subsys{grid-template-columns:1fr 1fr;column-gap:.7rem}
  .chart canvas{height:2.8rem}
  .chart.opt{display:none}
}
@media (max-height:760px){ .pd{display:none} }
@media (max-height:700px){
  .stat.opt{display:none}
  .legend{display:none}
}
@media (max-width:1000px){
  html,body{overflow:auto}
  .app{height:auto}
  .top{grid-template-columns:1fr;justify-items:start}
  .grid{grid-template-columns:1fr}
  .col.center .panel{min-height:70vh}
  .col .panel.grow{min-height:360px}
}
@media (prefers-reduced-motion:reduce){
  .scan,.ln-flow{animation:none}
}
</style>

<div class="app" id="app">

  <!-- ================= HEADER ================= -->
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="none" stroke="#5fc8ff" stroke-width="1.5"/>
        <polygon points="20,7 31.5,13.5 31.5,26.5 20,33 8.5,26.5 8.5,13.5" fill="rgba(95,200,255,.1)" stroke="rgba(95,200,255,.35)"/>

    </div>

    <div class="global">

    <div class="clockbox">

    <div class="controls">
      <div class="seg" role="group" aria-label="Language">
        <button id="langEn" type="button">EN</button>
        <button id="langZh" type="button">繁中</button>

      <button class="btn" id="btnScene" type="button"></button>
      <button class="btn" id="btnPause" type="button"></button>
      <button class="btn danger" id="btnEmg" type="button"></button>
      <button class="btn" id="btnFull" type="button"></button>
    </div>
  </header>

  <!-- ================= MAIN GRID ================= -->
  <main class="grid">

    <!-- LEFT: system status + train monitor -->
    <section class="col">
      <div class="panel">
        <div class="ph"><span data-i18n="pSystem"></span><span class="ph-r live"><span class="dot"></span><span data-i18n="live"></span></span></div>
        <div class="pb">
          <div class="health">
            <div class="gauge-box">
              <svg class="gauge" viewBox="0 0 100 100">
                <circle class="g-bg" cx="50" cy="50" r="42"/>
                <circle class="g-tick" cx="50" cy="50" r="34"/>
                <circle class="g-fg" id="gaugeArc" cx="50" cy="50" r="42" stroke-dashoffset="4"/>
              </svg>
              <div class="gauge-val"><span id="healthVal">98.7</span><small>%</small></div>
            </div>
            <div class="health-meta">
              <div class="lbl" data-i18n="netHealth"></div>
              <div class="hm-row"><span data-i18n="hm_tracked"></span><b id="hmTracked">--</b></div>
              <div class="hm-row"><span data-i18n="hm_lines"></span><b id="hmLines">--</b></div>
              <div class="hm-row"><span data-i18n="hm_incidents"></span><b id="hmInc">--</b></div>
            </div>
          </div>
          <div class="sub-h" data-i18n="lineStatus"></div>
          <div id="lineStatus"></div>
          <div class="sub-h" data-i18n="subsystems"></div>
          <div class="subsys" id="subsys"></div>
        </div>
      </div>

      <div class="panel grow">
        <div class="ph"><span data-i18n="pTrains"></span><span class="ph-r" id="trainCount"></span></div>
        <div class="pb scroll" id="trainWrap"><div id="trainList"></div></div>
      </div>
    </section>

    <!-- CENTER: network map -->
    <section class="col center">
      <div class="panel grow">
        <div class="ph"><span data-i18n="pMap"></span><div class="filters" id="filters"></div>
          <div class="viewseg" role="group"><button id="view2d" type="button"></button><button id="view3d" type="button"></button></div>
        </div>
        <div class="map-wrap">
          <svg id="map" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" aria-label="Fictional metro network map"></svg>
          <canvas id="city" aria-label="Fictional metro network, 3D view"></canvas>
          <div class="hint3d"><span id="hint3dA"></span><span id="hint3dB"></span></div>
          <div class="follow-tag"><span class="dot"></span><span id="followTxt"></span></div>

          <div class="scan"></div>

          <div class="detail" id="detail">

              <span data-i18n="f_line"></span><b id="dLine"></b>

          <div class="legend">

            <canvas id="cEnergy"></canvas>
          </div>
          <div class="sub-h" data-i18n="c_lineLoad"></div>
          <div id="lineLoad"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="scene-hint" data-i18n="sceneHint"></div>

  <!-- ================= TICKER ================= -->
  <footer class="ticker">
    <div class="tk-label"><span class="dot"></span><span data-i18n="feed"></span></div>
    <div class="tk-window"><div class="tk-track" id="tkTrack"></div></div>
    <div class="tk-keys" data-i18n="keys"></div>
  </footer>
</div>

<script>
(function () {
'use strict';

/* ======================================================================
   1. HELPERS
   ====================================================================== */
const $ = (s) => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

const fmtInt = (n) => Math.round(n).toLocaleString('en-US');
const fmtMS = (s) => { s = Math.max(0, Math.round(s)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); };
const fmtHMS = (s) => { s = Math.max(0, Math.round(s)); return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60); };
const fmtTime = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());

/* ======================================================================
   5. TRAIN MOVEMENT
   ====================================================================== */
function stepTrains(dt) {
  for (const tr of trains) {
    const L = LMAP[tr.line];

    if (tr.dwell > 0) {                       // standing at a platform
      tr.dwell -= dt;
      tr.speed = 0;
      if (tr.dwell <= 0) { tr.dwell = 0; if (tr.state !== 'HOLD') tr.state = 'RUN'; }
      continue;
    }

    const from = tr.dir > 0 ? Math.floor(tr.s) : Math.ceil(tr.s);
    const target = from + tr.dir;
    const prog = Math.abs(tr.s - from);                     // 0 → 1 along segment
    const profile = 0.22 + 0.78 * Math.min(1, Math.min(prog, 1 - prog) * 3.2); // accelerate / brake
    const slow = L.status === 'warn' ? 0.6 : 1;

    if (tr.state === 'HOLD') {
      tr.speed = Math.max(0, tr.speed - 30 * dt);           // emergency braking
    } else {
      tr.state = 'RUN';
      tr.speed += (tr.max * profile * slow - tr.speed) * Math.min(1, dt * 2.5);
    }

    const ds = tr.base * (tr.speed / tr.max) * dt;
    if (ds <= 0) continue;
    const ns = tr.s + tr.dir * ds;
    if ((tr.dir > 0 && ns >= target) || (tr.dir < 0 && ns <= target)) {
      tr.s = target;
      arrive(tr, L);
    } else {
      tr.s = ns;
    }
  }
}

function arrive(tr, L) {
  const n = L.stops.length;
  const idx = Math.round(tr.s);
  if (idx <= 0) tr.dir = 1;
  else if (idx >= n - 1) tr.dir = -1;
  tr.speed = 0;
  if (tr.state === 'HOLD') return;
  const terminus = idx === 0 || idx === n - 1;
  tr.dwell = rand(2.2, 4.2) + (terminus ? 2.5 : 0);
  tr.state = 'DWELL';
  tr.load = clamp(tr.load + rand(-14, 16) + (TRANSFER.has(L.stops[idx]) ? 6 : 0), 12, 98);
  if (terminus) tr.load = rand(15, 35);
  sim.ridership += ri(40, 180);
  if (simReady && simT - state.lastArrivalAlert >= 5 && Math.random() < 0.08) {
    state.lastArrivalAlert = simT;
    addAlert('info', 'arrive', { id: tr.id, st: L.stops[idx] });
  }
}

function trainStops(tr) {
  const L = LMAP[tr.line];
  const n = L.stops.length;
  let cur, nxt;
  if (tr.dwell > 0 || Number.isInteger(tr.s)) {
    cur = Math.round(tr.s);
    nxt = clamp(cur + tr.dir, 0, n - 1);
  } else {
    cur = tr.dir > 0 ? Math.floor(tr.s) : Math.ceil(tr.s);
    nxt = cur + tr.dir;
  }
  return { cur: L.stops[cur], nxt: L.stops[nxt], term: L.stops[tr.dir > 0 ? n - 1 : 0] };
}

function trainStatus(tr) {
  if (tr.state === 'HOLD') return ['crit', 'tr_hold'];
  if (tr.delay >= 45) return ['warn', 'tr_delay'];
  if (tr.dwell > 0) return ['info', 'tr_dwell'];
  return ['ok', 'tr_run'];
}

function trainXY(tr) {
  const L = LMAP[tr.line];
  const i = Math.min(Math.floor(tr.s), L.pts.length - 2);
  const f = tr.s - i;
  const a = L.pts[i], b = L.pts[i + 1];
  const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
  const ux = (b.x - a.x) / len, uy = (b.y - a.y) / len;
  const off = 5 * tr.dir;                                   // each direction on its own "track"
  return { x: a.x + (b.x - a.x) * f - uy * off, y: a.y + (b.y - a.y) * f + ux * off };
}

    <pattern id="gL" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="rgba(70,130,200,.17)"/></pattern>
  </defs>
  <rect x="-600" y="-600" width="2200" height="1820" fill="url(#gS)"/>
  <rect x="-600" y="-600" width="2200" height="1820" fill="url(#gL)"/>
  <path class="water" d="M600 760 L600 545 Q700 482 820 472 Q930 462 1200 470 L1200 760 Z"/>

  <text class="sector" data-sec="N-01" x="610" y="32"></text>
  <text class="sector" data-sec="W-02" x="18" y="440"></text>
  <text class="sector" data-sec="S-03" x="560" y="600"></text>
  <text class="sector" data-sec="E-04" x="860" y="300"></text>
  <path d="M0 22V0H22 M978 0H1000V22 M1000 598V620H978 M22 620H0V598" fill="none" stroke="rgba(127,180,230,.45)" stroke-width="1.5"/>`;

  LINES.forEach((L) => {
    const pts = L.pts.map((p) => p.x + ',' + p.y).join(' ');
    h += `<g class="line-g" id="lg-${L.id}">
      <polyline class="ln-glow" points="${pts}" stroke="${L.color}"/>
      <polyline class="ln" points="${pts}" stroke="${L.color}"/>
      <polyline class="ln-flow" points="${pts}"/>`;
    // line badges at both ends
    [[0, 1], [L.pts.length - 1, L.pts.length - 2]].forEach(([e, inner]) => {
      const p = L.pts[e], q = L.pts[inner];
      const d = Math.hypot(p.x - q.x, p.y - q.y) || 1;
      const bx = p.x + (p.x - q.x) / d * 24, by = p.y + (p.y - q.y) / d * 24;
      h += `<g class="term" transform="translate(${bx.toFixed(1)} ${by.toFixed(1)})"><rect x="-8" y="-8" width="16" height="16" fill="${L.color}"/><text y="3.6">${L.id}</text></g>`;
    });
    h += `</g>`;
  });

  h += `<g id="emLayer"></g><g id="stnLayer">`;
  Object.keys(STN).forEach((id) => {
    const s = STN[id];
    if (TRANSFER.has(id)) {
      h += `<circle class="stn-x-ring" cx="${s.x}" cy="${s.y}" r="12"/><circle class="stn-x" cx="${s.x}" cy="${s.y}" r="7.5"/>`;
    } else {
      const col = LINES.find((L) => L.stops.includes(id)).color;
      h += `<circle class="stn" cx="${s.x}" cy="${s.y}" r="4.8" stroke="${col}"/>`;
    }
    h += `<text class="stn-lbl${TRANSFER.has(id) ? ' x' : ''}" id="lbl-${id}" x="${s.x + s.lx}" y="${s.y + s.ly}" text-anchor="${s.a}"></text>`;
  });
  h += `</g><g id="trainLayer"></g>`;
  map.innerHTML = h;

  trainLayer = map.querySelector('#trainLayer');
  emLayer = map.querySelector('#emLayer');
  Object.keys(STN).forEach((id) => { STN[id].lbl = map.querySelector('#lbl-' + id); });
  map.querySelectorAll('[data-sec]').forEach((el) => sectorEls.push(el));

  // train markers
  trains.forEach((tr) => {
    const g = document.createElementNS(SVGNS, 'g');
    const col = LMAP[tr.line].color;
    g.setAttribute('class', 'train');
    g.innerHTML = `<circle class="halo" r="11" fill="${col}"/><circle class="ring" r="10"/><circle class="core" r="5.2" fill="${col}"/><text x="8" y="-8">${tr.id}</text>`;
    g.addEventListener('click', () => selectTrain(tr.id));
    trainLayer.appendChild(g);
    tr.el = g;
    tr.cls = '';
  });
}

/* gentle auto-scroll of the train list (pauses under the mouse) */
const autoScroll = { pos: 0, hold: 60, atEnd: false, hover: false };
function setupAutoScroll() {
  const w = $('#trainWrap');
  w.addEventListener('mouseenter', () => { autoScroll.hover = true; });
  w.addEventListener('mouseleave', () => { autoScroll.hover = false; autoScroll.pos = w.scrollTop; });
  setInterval(() => {
    const max = w.scrollHeight - w.clientHeight;
    if (autoScroll.hover || state.paused || max <= 2) { autoScroll.pos = w.scrollTop; return; }
    if (autoScroll.hold > 0) { autoScroll.hold--; return; }
    if (autoScroll.atEnd) { autoScroll.atEnd = false; autoScroll.pos = 0; w.scrollTop = 0; autoScroll.hold = 50; return; }
    autoScroll.pos = Math.min(max, autoScroll.pos + 0.5);
    w.scrollTop = autoScroll.pos;
    if (autoScroll.pos >= max) { autoScroll.atEnd = true; autoScroll.hold = 70; }
  }, 50);
}

/* small canvas line charts */
function drawChart(cv, data, color) {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);

  c.strokeStyle = 'rgba(70,130,200,.14)';
  c.lineWidth = 1;
  c.beginPath();
  for (let i = 1; i < 4; i++) { const y = Math.round(h * i / 4) + 0.5; c.moveTo(0, y); c.lineTo(w, y); }
  for (let i = 1; i < 12; i++) { const x = Math.round(w * i / 12) + 0.5; c.moveTo(x, 0); c.lineTo(x, h); }
  c.stroke();
  if (data.length < 2) return;

  let mn = Math.min.apply(null, data), mx = Math.max.apply(null, data);
  const padv = (mx - mn) * 0.25 || 1;
  mn -= padv; mx += padv;
  const N = 60, step = w / (N - 1), off = N - data.length;
  const X = (i) => (i + off) * step;
  const Y = (v) => h - (v - mn) / (mx - mn) * h;

  c.beginPath();
  data.forEach((v, i) => { if (i) c.lineTo(X(i), Y(v)); else c.moveTo(X(i), Y(v)); });
  c.strokeStyle = color;
  c.lineWidth = 1.6;
  c.shadowColor = color;
  c.shadowBlur = 6;
  c.stroke();
  c.shadowBlur = 0;

  c.lineTo(X(data.length - 1), h);
  c.lineTo(X(0), h);
  c.closePath();
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, color + '55');
  g.addColorStop(1, color + '00');
  c.fillStyle = g;
  c.fill();

  const lx = X(data.length - 1), ly = Y(data[data.length - 1]);
  c.fillStyle = '#fff';
  c.beginPath();
  c.arc(lx - 2, ly, 2.4, 0, Math.PI * 2);
  c.fill();
}

function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFull() {
  const d = document.documentElement;
  try {
    let r;
    if (!isFull()) {
      const fn = d.requestFullscreen || d.webkitRequestFullscreen;
      if (fn) r = fn.call(d);
    } else {
      const fn = document.exitFullscreen || document.webkitExitFullscreen;
      if (fn) r = fn.call(document);
    }
    if (r && r.catch) r.catch(() => {});
  } catch (e) { /* fullscreen not allowed — ignore */ }
}

/* ---- story beats: drive the screen through a scripted escalation ---- */
function forceWarn(L, minutes) {
  L = L || pick(LINES.filter((x) => x.status === 'ok'));
  if (!L) return;
  const m = minutes || ri(2, 6);
  L.status = 'warn';
  state.warnLine = L.id;
  state.warnUntil = simT + ri(26, 42);
  trains.forEach((tr) => { if (tr.line === L.id) tr.delay += m * 60 * rand(0.4, 1); });
  addAlert('warn', 'delay', { line: L.id, m, c: ri(0, 3) });
}
function clearWarn(silent) {
  if (!state.warnLine) return;
  const id = state.warnLine;
  LMAP[id].status = 'ok';
  state.warnLine = null;
  if (!silent) addAlert('info', 'restored', { line: id });
}
function setBeat(n) {
  state.beat = n;
  if (n === 0) {
    state.nextWarnAt = simT + ri(10, 20);
    addAlert('info', 'beatFree');
  } else if (n === 1) {                       // calm: everything back to normal
    if (state.emergency) resolveEmergency(true);
    clearWarn(true);
    trains.forEach((tr) => { tr.delay = Math.min(tr.delay, 15); });
    state.nextWarnAt = simT + 9999;
    addAlert('info', 'beatCalm');
  } else if (n === 2) {                       // building: delays and crowding grow
    if (state.emergency) resolveEmergency(true);
    addAlert('warn', 'beatBuild');
    if (!state.warnLine) forceWarn(null, ri(3, 6));
    state.nextEventAt = simT + 2;
  } else if (n === 3) {                       // crisis: emergency plus a second line in trouble
    addAlert('crit', 'beatCrisis');
    if (!state.emergency) startEmergency();
    const others = LINES.filter((L) => L.id !== state.emergency.line && L.status === 'ok');
    if (others.length) forceWarn(pick(others), ri(4, 8));
    state.nextEventAt = simT + 2;
  } else if (n === 4) {                       // recovery: emergency cleared, delays draining
    if (state.emergency) resolveEmergency(true);
    clearWarn(true);
    addAlert('info', 'beatRecover');
    state.nextWarnAt = simT + 60;
  }
  renderBeat();
}
function nextBeat() { setBeat(state.beat >= 4 ? 0 : state.beat + 1); }
function renderBeat() {
  const b = state.beat;
  const pips = [1, 2, 3, 4].map((i) =>
    `<span class="pip${i <= b && b > 0 ? ' on' : ''}${b === 3 && i === 3 ? ' max' : b === 2 && i === 2 ? ' hot' : ''}"></span>`).join('');
  $('#beatBox').innerHTML = `${t('seq')} <b>${t('beat' + b)}</b><span class="pips">${pips}</span>`;
}

/* ======================================================================
   11. EMERGENCY SIMULATION
   ====================================================================== */
const emTimers = [];
function startEmergency() {
  if (state.emergency) return;
  const L = pick(LINES);
  const seg = ri(0, L.stops.length - 2);
  const a = L.stops[seg], b = L.stops[seg + 1];
  state.emergency = { line: L.id, a, b };
  if (state.warnLine === L.id) state.warnLine = null;
  L.status = 'crit';
  trains.forEach((tr) => { if (tr.line === L.id) { tr.state = 'HOLD'; tr.dwell = 0; } });

  const pa = STN[a], pb = STN[b];
  const mx = (pa.x + pb.x) / 2, my = (pa.y + pb.y) / 2;
  emLayer.innerHTML = `<line class="em-seg" x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}"/>
    <g transform="translate(${mx} ${my})"><circle class="em-wave" r="12"/><circle class="em-wave w2" r="12"/>
    <circle class="em-core" r="9"/><text class="em-x" y="4">!</text></g>`;

  document.body.classList.add('emergency');
  addAlert('crit', 'emIntrusion', { line: L.id, a, b });
  addAlert('crit', 'emHold', { line: L.id });
  emTimers.push(setTimeout(() => { if (state.emergency) addAlert('warn', 'emPower', { a, b }); }, 2500));
  emTimers.push(setTimeout(() => { if (state.emergency) addAlert('info', 'emTeam'); }, 5500));
  refreshAll();
}
function resolveEmergency(silent) {
  if (!state.emergency) return;
  const id = state.emergency.line;
  LMAP[id].status = 'ok';
  trains.forEach((tr) => {
    if (tr.line === id && tr.state === 'HOLD') { tr.state = 'RUN'; tr.delay += ri(60, 200); }
  });
  state.emergency = null;
  emTimers.splice(0).forEach(clearTimeout);
  emLayer.innerHTML = '';
  document.body.classList.remove('emergency');
  state.nextWarnAt = simT + ri(20, 35);
  if (!silent) addAlert('info', 'emClear', { line: id });
  refreshAll();
}
function toggleEmergency() { if (state.emergency) resolveEmergency(); else startEmergency(); }
function renderEmBanner() {

const tkTrack = $('#tkTrack');
function buildTicker() {
  const T = TK[lang];
  const okLines = LINES.filter((L) => L.status === 'ok').length;
  const moving = trains.filter((x) => x.state !== 'HOLD');
  const tr = moving.length ? pick(moving) : trains[0];
  const avgHw = LINES.reduce((a, L) => a + L.hw, 0) / LINES.length;
  const items = [];
  if (state.emergency) items.push({ h: msg('emIntrusion', state.emergency), c: 'c' });
  if (state.warnLine) items.push({ h: `${LN(state.warnLine)} — ${t('st_warn')}`, c: 'w' });
  items.push({ h: T.update(okLines), c: okLines < 4 ? 'w' : '' });
  items.push({ h: T.approach(tr.id, trainStops(tr).nxt) });
  items.push({ h: T.monitor() });

  items.push({ h: T.pax(fmtInt(sim.pax)) });

}

/* ======================================================================
   14. MAIN SIMULATION TICK (once per second)
   ====================================================================== */
function simulateSecond() {
  simT++;
  const em = !!state.emergency, warn = !!state.warnLine;
  const b = state.beat;                       // story beat drives the mood of the data
  const tense = b === 3 || em ? 2 : b === 2 ? 1 : 0;

  // train delays and loads
  trains.forEach((tr) => {
    if (tr.state === 'HOLD') tr.delay += 1;
    else if (state.warnLine === tr.line) tr.delay += 0.5;
    else tr.delay = Math.max(0, tr.delay - 3);
    tr.delay = Math.min(tr.delay, 600);          // never drift past 10 minutes
    tr.load = clamp(tr.load + rand(-1.2, 1.2), 10, 99);
  });

  // headways
  LINES.forEach((L) => { L.hw = walk(L.hw, 2.5, L.status === 'warn' ? 255 : 168, 120, 320); });

  // statistics
  sim.sysLoad = walk(sim.sysLoad, 1.6, tense === 2 ? 90 : tense === 1 ? 81 : warn ? 79 : b === 1 ? 64 : 70, 50, 97);
  sim.net = walk(sim.net, 0.15, tense === 2 ? 90 : tense === 1 ? 95.8 : warn ? 96.6 : b === 1 ? 99.3 : 98.9, 85, 99.9);
  sim.plat = walk(sim.plat, 1.8, tense === 2 ? 91 : tense === 1 ? 78 : warn ? 76 : b === 1 ? 49 : 58, 30, 98);
  sim.ontime = walk(sim.ontime, 0.12, tense === 2 ? 87 : tense === 1 ? 93.5 : warn ? 94.5 : b === 1 ? 99 : 97.6, 80, 99.8);
  sim.ridership += ri(8, 32);
  sim.flow = walk(sim.flow, 140, em ? 2900 : 4300, 2200, 6400);
  const paxNow = trains.reduce((a, x) => a + x.load / 100 * 1800, 0) + rand(-40, 40);
  sim.pax += (paxNow - sim.pax) * 0.25;          // smooth, so the figure drifts instead of jumping
  sim.energy = 1.35 + trains.reduce((a, x) => a + (x.speed / 85) * 0.26 + (x.dwell > 0 ? 0.03 : 0), 0) + rand(-0.04, 0.04);
  sim.flowHist.push(sim.flow); if (sim.flowHist.length > 60) sim.flowHist.shift();
  sim.energyHist.push(sim.energy); if (sim.energyHist.length > 60) sim.energyHist.shift();

  // platform crowding per station
  Object.keys(state.dens).forEach((id) => {
    const base = (TRANSFER.has(id) ? 60 : 42) + tense * 11 + (b === 1 ? -10 : 0)
      + (state.emergency && LMAP[state.emergency.line].stops.includes(id) ? 14 : 0);
    state.dens[id] = walk(state.dens[id], 3, base, 6, 99);
  });

  // subsystem readings
  sub.kv = walk(sub.kv, 0.01, 1.51, 1.46, 1.58);
  sub.lat = Math.round(walk(sub.lat, 2, 12, 7, 22));
  sub.fans = em ? 48 : ri(22, 26);
  sub.sig = warn ? 211 : 212;
  sub.psd = walk(sub.psd, 0.05, 99.9, 99.4, 100);
  if (simT >= state.cctvWarnUntil && sub.lostCam) {
    addAlert('info', 'cctvBack', { n: sub.lostCam });
    sub.lostCam = 0;
  }
  sub.cams = simT < state.cctvWarnUntil ? 485 : 486;

  // line delay events
  if (!em && !state.warnLine && simT >= state.nextWarnAt && b !== 1) {
    const L = pick(LINES);
    const m = ri(2, 5);
    L.status = 'warn';
    state.warnLine = L.id;
    state.warnUntil = simT + ri(22, 38);
    trains.forEach((tr) => { if (tr.line === L.id) tr.delay += m * 60 * rand(0.4, 1); });
    addAlert('warn', 'delay', { line: L.id, m, c: ri(0, 3) });
  }
  if (state.warnLine && simT >= state.warnUntil && b !== 2 && b !== 3) {
    clearWarn(false);
    state.nextWarnAt = simT + ri(28, 48);
  }

  // background events
  if (simT >= state.nextEventAt) {
    state.nextEventAt = simT + (tense ? ri(2, 5) : b === 1 ? ri(7, 12) : ri(4, 8));
    let r = Math.random();
    if (b === 1) r = 0.34 + r * 0.44;          // calm beat: routine information only
    if (tense) r = r * 0.55;                   // tense beats: more warnings
    if (r < 0.2) {
      const cst = pick([...TRANSFER]);
      addAlert('warn', 'crowd', { st: cst, pf: pad(ri(1, 8)) });
      state.dens[cst] = Math.min(99, state.dens[cst] + 22);
      sim.plat = Math.min(98, sim.plat + 8);
    } else if (r < 0.34) {
      addAlert('info', 'substation', { n: ri(1, 18), v: ri(52, 81) });
    } else if (r < 0.52) {
      addAlert('info', 'dispatch', { id: pick(trains).id, s: pick([10, 15, 20, 30]) });
    } else if (r < 0.66) {
      addAlert('info', 'radio', { n: ri(2, 16) });
    } else if (r < 0.78 && !sub.lostCam && !em) {
      sub.lostCam = ri(100, 486);
      state.cctvWarnUntil = simT + ri(6, 10);
      addAlert('warn', 'cctvLost', { n: sub.lostCam });
    } else {
      addAlert('info', 'signal', { n: 212 });
    }
  }

  // periodic system check
  state.nextCheck--;
  if (state.nextCheck <= 0) {
    addAlert('info', 'syscheck');
    state.nextCheck = 180;
  }
}

/* ======================================================================
   15. 3D CITY VIEW
   A small perspective renderer written from scratch on a 2D canvas, so the
   file stays self-contained (no 3D library, nothing to download).
   World axes: X east, Y up, Z south. The flat map (0..1000, 0..620) is
   centred on the origin.
   ====================================================================== */
const cv3 = $('#city');
const cx3 = cv3.getContext('2d');
const cam = {
  yaw: -0.55, pitch: 0.58, dist: 980,
  tx: 0, ty: 0, tz: 0,                    // look-at point
  gx: 0, gz: 0, gdist: 980, gpitch: 0.58, // goals, eased every frame
  lastInput: 0, drag: false, hover: null
};
const CAM_DEFAULT = { yaw: -0.55, pitch: 0.58, dist: 980, gx: 0, gz: 0 };
const W3 = { w: 0, h: 0, f: 800, cx: 0, cy: 0, cy_: 0, sy_: 0, cp_: 0, sp_: 0 };
const w3x = (x) => x - 500;               // map x  -> world X
const w3z = (y) => y - 310;               // map y  -> world Z

function project(x, y, z) {
  const dx = x - cam.tx, dy = y - cam.ty, dz = z - cam.tz;
  const X = dx * W3.cy_ - dz * W3.sy_;
  const Z1 = dx * W3.sy_ + dz * W3.cy_;
  const Y2 = dy * W3.cp_ + Z1 * W3.sp_;
  const Z2 = -dy * W3.sp_ + Z1 * W3.cp_ + cam.dist;
  if (Z2 < 40) return null;
  return { x: W3.cx + W3.f * X / Z2, y: W3.cy - W3.f * Y2 / Z2, z: Z2 };
}

/* ---- fictional city blocks, generated once from a fixed seed ---- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function distToSeg(px, pz, ax, az, bx, bz) {
  const vx = bx - ax, vz = bz - az;
  const L = vx * vx + vz * vz || 1;
  let t = ((px - ax) * vx + (pz - az) * vz) / L;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (ax + vx * t), pz - (az + vz * t));
}
const SEGS = [];
LINES.forEach((L) => {
  for (let i = 0; i < L.pts.length - 1; i++) {
    SEGS.push([w3x(L.pts[i].x), w3z(L.pts[i].y), w3x(L.pts[i + 1].x), w3z(L.pts[i + 1].y)]);
  }
});
const BUILDINGS = [];
(function buildCity() {
  const rnd = mulberry32(20260917);
  let guard = 0;
  while (BUILDINGS.length < 110 && guard++ < 4000) {
    const x = -540 + rnd() * 1080, z = -350 + rnd() * 700;
    let ok = true;
    for (const s of SEGS) { if (distToSeg(x, z, s[0], s[1], s[2], s[3]) < 34) { ok = false; break; } }
    if (!ok) continue;
    for (const b of BUILDINGS) { if (Math.abs(b.x - x) < 44 && Math.abs(b.z - z) < 44) { ok = false; break; } }
    if (!ok) continue;
    const core = Math.hypot(x, z) < 190 ? 1.9 : Math.hypot(x, z) < 340 ? 1.25 : 0.7;
    BUILDINGS.push({
      x, z,
      w: 18 + rnd() * 26, d: 18 + rnd() * 26,
      h: (12 + rnd() * 52) * core,
      lit: rnd() < 0.5
    });
  }
})();

/* ---- surface road traffic, to show the city living around the metro ---- */
const ROADS_X = [-470, -310, -150, 10, 170, 330, 470];
const ROADS_Z = [-300, -180, -60, 60, 180, 300];
const CARS = [];
(function buildTraffic() {
  const rnd = mulberry32(77);
  for (let i = 0; i < 46; i++) {
    const vertical = rnd() < 0.5;
    CARS.push({
      v: vertical,
      lane: vertical ? ROADS_X[Math.floor(rnd() * ROADS_X.length)] : ROADS_Z[Math.floor(rnd() * ROADS_Z.length)],
      pos: -350 + rnd() * 700,
      dir: rnd() < 0.5 ? 1 : -1,
      sp: 26 + rnd() * 34,
      warm: rnd() < 0.5
    });
  }
})();

/* ---- drawing helpers ---- */
function strokeSeg3(ax, ay, az, bx, by, bz, color, width, alpha) {
  const a = project(ax, ay, az), b = project(bx, by, bz);
  if (!a || !b) return;
  cx3.globalAlpha = alpha === undefined ? 1 : alpha;
  cx3.strokeStyle = color;
  cx3.lineWidth = width;
  cx3.beginPath();
  cx3.moveTo(a.x, a.y);
  cx3.lineTo(b.x, b.y);
  cx3.stroke();
  cx3.globalAlpha = 1;
}
function facePath(pts) {
  cx3.beginPath();
  cx3.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) cx3.lineTo(pts[i].x, pts[i].y);
  cx3.closePath();
}
function signedArea(p) {
  let a = 0;
  for (let i = 0; i < p.length; i++) {
    const q = p[(i + 1) % p.length];
    a += p[i].x * q.y - q.x * p[i].y;
  }
  return a;
}
/* a box standing on the ground, given its four base corners */
function drawPrism(base, h, side, top, edge, alpha) {
  const b = base.map((c) => project(c[0], 0, c[1]));
  const u = base.map((c) => project(c[0], h, c[1]));
  if (b.some((p) => !p) || u.some((p) => !p)) return;
  cx3.globalAlpha = alpha === undefined ? 1 : alpha;
  for (let i = 0; i < 4; i++) {
    const j = (i + 1) % 4;
    const face = [b[i], b[j], u[j], u[i]];
    if (signedArea(face) <= 0) continue;              // back face, skip
    facePath(face);
    cx3.fillStyle = side;
    cx3.fill();
    if (edge) { cx3.strokeStyle = edge; cx3.lineWidth = 1; cx3.stroke(); }
  }
  facePath(u);
  cx3.fillStyle = top;
  cx3.fill();
  if (edge) { cx3.strokeStyle = edge; cx3.lineWidth = 1; cx3.stroke(); }
  cx3.globalAlpha = 1;
}
function rectBase(x, z, w, d, ux, uz) {
  // ux/uz = forward direction (defaults to axis aligned)
  const fx = ux === undefined ? 1 : ux, fz = uz === undefined ? 0 : uz;
  const px = -fz, pz = fx;
  const hw = w / 2, hd = d / 2;
  return [
    [x + fx * hw + px * hd, z + fz * hw + pz * hd],
    [x + fx * hw - px * hd, z + fz * hw - pz * hd],
    [x - fx * hw - px * hd, z - fz * hw - pz * hd],
    [x - fx * hw + px * hd, z - fz * hw + pz * hd]
  ];
}
function ring3(x, z, r, y, color, width, alpha) {
  const pts = [];
  for (let i = 0; i <= 28; i++) {
    const a = i / 28 * Math.PI * 2;
    const p = project(x + Math.cos(a) * r, y, z + Math.sin(a) * r);
    if (!p) return;
    pts.push(p);
  }
  cx3.globalAlpha = alpha === undefined ? 1 : alpha;
  cx3.strokeStyle = color;
  cx3.lineWidth = width;
  facePath(pts);
  cx3.stroke();
  cx3.globalAlpha = 1;
}

/* ---- world position of a train, in 3D ---- */
function train3D(tr) {
  const L = LMAP[tr.line];
  const i = Math.min(Math.floor(tr.s), L.pts.length - 2);
  const f = tr.s - i;
  const a = L.pts[i], b = L.pts[i + 1];
  const ax = w3x(a.x), az = w3z(a.y), bx = w3x(b.x), bz = w3z(b.y);
  const len = Math.hypot(bx - ax, bz - az) || 1;
  const ux = (bx - ax) / len, uz = (bz - az) / len;
  const off = 5 * tr.dir;
  return { x: ax + (bx - ax) * f - uz * off, z: az + (bz - az) * f + ux * off, ux, uz };
}

/* ---- threats: what the control room is worried about right now ---- */
function activeThreats() {
  const list = [];
  if (state.emergency) {
    const a = STN[state.emergency.a], b = STN[state.emergency.b];
    list.push({ lv: 'crit', kind: 'th_intr', x: (w3x(a.x) + w3x(b.x)) / 2, z: (w3z(a.y) + w3z(b.y)) / 2,
      label: `${LN(state.emergency.line)} · ${S(state.emergency.a)} – ${S(state.emergency.b)}` });
  }
  Object.keys(state.dens).forEach((id) => {
    if (state.dens[id] > 84) {
      list.push({ lv: 'warn', kind: 'th_crowd', x: w3x(STN[id].x), z: w3z(STN[id].y),
        label: `${S(id)} · ${Math.round(state.dens[id])}%` });
    }
  });
  if (state.warnLine) {
    const L = LMAP[state.warnLine];
    const mid = L.pts[Math.floor(L.pts.length / 2)];
    list.push({ lv: 'warn', kind: 'th_delay', x: w3x(mid.x), z: w3z(mid.y), label: LFull(L), flat: true });
  }
  return list;
}

/* ---- the frame ---- */
let threatSig = '';
function render3D(dt) {
  const w = cv3.clientWidth, h = cv3.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  if (cv3.width !== Math.round(w * dpr) || cv3.height !== Math.round(h * dpr)) {
    cv3.width = Math.round(w * dpr);
    cv3.height = Math.round(h * dpr);
  }
  cx3.setTransform(dpr, 0, 0, dpr, 0, 0);
  W3.w = w; W3.h = h; W3.cx = w / 2; W3.cy = h * 0.58; W3.f = h * 1.02;

  // camera easing, follow mode and idle orbit
  if (state.follow && TMAP[state.selected]) {
    const p = train3D(TMAP[state.selected]);
    cam.gx = p.x; cam.gz = p.z;
    cam.gdist = 330; cam.gpitch = 0.42;
  }
  cam.tx += (cam.gx - cam.tx) * Math.min(1, dt * 2.2);
  cam.tz += (cam.gz - cam.tz) * Math.min(1, dt * 2.2);
  cam.dist += (cam.gdist - cam.dist) * Math.min(1, dt * 2.2);
  cam.pitch += (cam.gpitch - cam.pitch) * Math.min(1, dt * 2.2);
  if (!cam.drag && !state.paused && performance.now() - cam.lastInput > 12000) cam.yaw += 0.03 * dt;
  W3.cy_ = Math.cos(cam.yaw); W3.sy_ = Math.sin(cam.yaw);
  W3.cp_ = Math.cos(cam.pitch); W3.sp_ = Math.sin(cam.pitch);

  const g = cx3.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#04080f');
  g.addColorStop(0.55, '#061223');
  g.addColorStop(1, '#03070d');
  cx3.fillStyle = g;
  cx3.fillRect(0, 0, w, h);

  // ground grid
  cx3.lineCap = 'butt';
  for (let x = -600; x <= 600; x += 60) strokeSeg3(x, 0, -380, x, 0, 380, '#1b3c63', 1, 0.55);
  for (let z = -380; z <= 380; z += 60) strokeSeg3(-600, 0, z, 600, 0, z, '#1b3c63', 1, 0.55);

  // roads and their traffic
  ROADS_X.forEach((x) => strokeSeg3(x, 0.4, -360, x, 0.4, 360, '#24507f', 2.2, 0.55));
  ROADS_Z.forEach((z) => strokeSeg3(-560, 0.4, z, 560, 0.4, z, '#24507f', 2.2, 0.55));
  if (!state.paused) {
    CARS.forEach((c) => {
      c.pos += c.dir * c.sp * dt;
      if (c.pos > 360) c.pos = -360;
      if (c.pos < -360) c.pos = 360;
    });
  }
  CARS.forEach((c) => {
    const x = c.v ? c.lane + (c.dir > 0 ? 3 : -3) : c.pos;
    const z = c.v ? c.pos : c.lane + (c.dir > 0 ? 3 : -3);
    const p = project(x, 1.5, z);
    if (!p) return;
    const sz = clamp(W3.f * 3 / p.z, 0.8, 5);
    cx3.globalAlpha = 0.85;
    cx3.fillStyle = c.warm ? '#ffd9a0' : '#9fd4ff';
    cx3.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
    cx3.globalAlpha = 1;
  });

  // city blocks, far ones first
  const nearCut = cam.dist * 0.42;                 // hide blocks that would sit in front of the camera
  const blocks = BUILDINGS.map((b) => {
    const p = project(b.x, b.h / 2, b.z);
    return p && p.z > nearCut ? { b, z: p.z } : null;
  }).filter(Boolean).sort((a, c) => c.z - a.z);
  blocks.forEach(({ b }) => {
    drawPrism(rectBase(b.x, b.z, b.w, b.d), b.h,
      'rgba(12,30,52,.92)', 'rgba(22,52,84,.95)',
      b.lit ? 'rgba(95,200,255,.30)' : 'rgba(80,140,200,.16)');
  });

  // metro lines on the ground
  LINES.forEach((L) => {
    const dim = state.filter !== 'ALL' && state.filter !== L.id;
    const col = L.status === 'crit' ? '#ff3355' : L.status === 'warn' ? '#ffb020' : L.color;
    for (let i = 0; i < L.pts.length - 1; i++) {
      const a = L.pts[i], b = L.pts[i + 1];
      const pa = project(w3x(a.x), 3, w3z(a.y)), pb = project(w3x(b.x), 3, w3z(b.y));
      if (!pa || !pb) continue;
      const lw = clamp(W3.f * 7 / ((pa.z + pb.z) / 2), 1.2, 16);
      cx3.globalAlpha = dim ? 0.13 : 0.9;
      cx3.strokeStyle = col;
      cx3.lineCap = 'round';
      cx3.lineWidth = lw;
      cx3.shadowColor = col;
      cx3.shadowBlur = dim ? 0 : 12;
      cx3.beginPath();
      cx3.moveTo(pa.x, pa.y);
      cx3.lineTo(pb.x, pb.y);
      cx3.stroke();
      cx3.shadowBlur = 0;
      cx3.globalAlpha = 1;
    }
  });

  // station towers: height and colour follow platform crowding
  const towers = [];
  Object.keys(STN).forEach((id) => {
    const st = STN[id];
    const x = w3x(st.x), z = w3z(st.y);
    const p = project(x, 0, z);
    if (p) towers.push({ id, x, z, z2: p.z });
  });
  towers.sort((a, b) => b.z2 - a.z2);
  towers.forEach((tw) => {
    const dens = state.dens[tw.id];
    const isX = TRANSFER.has(tw.id);
    const hgt = 9 + dens * 0.5;
    const line = LINES.find((L) => L.stops.includes(tw.id));
    const dim = state.filter !== 'ALL' && !LMAP[state.filter].stops.includes(tw.id);
    const hot = dens > 84 ? '#ff3355' : dens > 68 ? '#ffb020' : (isX ? '#eef6ff' : line.color);
    const wd = isX ? 19 : 12;
    cx3.globalAlpha = dim ? 0.2 : 1;
    drawPrism(rectBase(tw.x, tw.z, wd, wd), hgt,
      'rgba(10,26,46,.86)', hot, hot, dim ? 0.2 : 0.95);
    if (dens > 68) ring3(tw.x, tw.z, wd, hgt + 3, hot, 1.6, 0.8);
    cx3.globalAlpha = 1;
    // name plate for transfer stations, and for the station nearest the camera focus
    if (isX && !dim) {
      const p = project(tw.x, hgt + 16, tw.z);
      if (p && p.z < 1700) {
        cx3.font = `${clamp(W3.f * 11 / p.z, 8, 15).toFixed(1)}px ${getComputedStyle(document.body).getPropertyValue('--sans')}`;
        cx3.fillStyle = 'rgba(230,242,255,.92)';
        cx3.textAlign = 'center';
        cx3.fillText(S(tw.id), p.x, p.y);
      }
    }
  });

  // threats
  activeThreats().forEach((th) => {
    const col = th.lv === 'crit' ? '#ff3355' : '#ffb020';
    const beat = 0.5 + 0.5 * Math.sin(performance.now() / (th.lv === 'crit' ? 260 : 460));
    if (!th.flat) {
      ring3(th.x, th.z, 26 + beat * 26, 1, col, 2, 0.25 + beat * 0.5);
      ring3(th.x, th.z, 16, 1, col, 1.5, 0.7);
      const base = project(th.x, 2, th.z), top = project(th.x, 120 + beat * 26, th.z);
      if (base && top) {
        const grad = cx3.createLinearGradient(base.x, base.y, top.x, top.y);
        grad.addColorStop(0, col);
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        cx3.globalAlpha = 0.5 + beat * 0.4;
        cx3.strokeStyle = grad;
        cx3.lineWidth = th.lv === 'crit' ? 4 : 2.4;
        cx3.beginPath();
        cx3.moveTo(base.x, base.y);
        cx3.lineTo(top.x, top.y);
        cx3.stroke();
        cx3.globalAlpha = 1;
        if (th.lv === 'crit') {
          cx3.font = `700 ${clamp(W3.f * 12 / base.z, 9, 17).toFixed(1)}px ${getComputedStyle(document.body).getPropertyValue('--mono')}`;
          cx3.fillStyle = col;
          cx3.textAlign = 'center';
          cx3.fillText('⚠ ' + t('th_intr'), top.x, top.y - 6);
        }
      }
    }
  });

  // trains
  const drawn = [];
  trains.forEach((tr) => {
    const p3 = train3D(tr);
    const p = project(p3.x, 7, p3.z);
    if (!p) return;
    const dim = state.filter !== 'ALL' && tr.line !== state.filter;
    const sel = tr.id === state.selected;
    const col = tr.state === 'HOLD' ? '#ff3355' : LMAP[tr.line].color;
    cx3.globalAlpha = dim ? 0.18 : 1;
    drawPrism(rectBase(p3.x, p3.z, 26, 9, p3.ux, p3.uz), 9,
      'rgba(8,20,36,.9)', col, sel ? '#ffffff' : col, dim ? 0.2 : 1);
    if (!dim) {
      cx3.globalAlpha = 0.5;
      cx3.fillStyle = col;
      cx3.shadowColor = col;
      cx3.shadowBlur = 14;
      cx3.beginPath();
      cx3.arc(p.x, p.y, clamp(W3.f * 4 / p.z, 1.5, 7), 0, Math.PI * 2);
      cx3.fill();
      cx3.shadowBlur = 0;
      cx3.globalAlpha = 1;
    }
    if (sel || cam.hover === tr.id) {
      const top = project(p3.x, 34, p3.z);
      if (top) {
        cx3.strokeStyle = sel ? '#ffffff' : '#9fd4ff';
        cx3.globalAlpha = 0.8;
        cx3.lineWidth = 1.2;
        cx3.beginPath();
        cx3.moveTo(p.x, p.y);
        cx3.lineTo(top.x, top.y);
        cx3.stroke();
        cx3.globalAlpha = 1;
        cx3.font = `700 ${clamp(W3.f * 12 / p.z, 9, 18).toFixed(1)}px ${getComputedStyle(document.body).getPropertyValue('--mono')}`;
        cx3.fillStyle = sel ? '#ffffff' : '#cfe3ff';
        cx3.textAlign = 'center';
        cx3.fillText(tr.id + '  ' + Math.round(tr.speed) + ' km/h', top.x, top.y - 5);
      }
      if (sel) ring3(p3.x, p3.z, 20 + 6 * Math.sin(performance.now() / 300), 1, '#ffffff', 1.2, 0.5);
    }
    drawn.push({ id: tr.id, x: p.x, y: p.y });
  });
  cam.screen = drawn;

  // threat panel (HTML overlay)
  const th = activeThreats();
  const sig = th.map((x) => x.kind + x.label).join('|');
  if (sig !== threatSig) {
    threatSig = sig;
    const box = $('#threatBox');
    box.classList.toggle('on', th.length > 0);
    box.innerHTML = `<div class="t-h">${t('threats')} · ${th.length}</div>` +
      th.slice(0, 4).map((x) => `<div class="t-i ${x.lv}">${x.lv === 'crit' ? '■' : '▲'} ${t(x.kind)} — ${x.label}</div>`).join('');
  }
}

/* ---- pointer interaction ---- */
function setup3D() {
  let px = 0, py = 0, moved = 0;
  cv3.addEventListener('pointerdown', (e) => {
    cam.drag = true; moved = 0; px = e.clientX; py = e.clientY;
    cam.lastInput = performance.now();
    cv3.classList.add('drag');
    cv3.setPointerCapture(e.pointerId);
  });
  cv3.addEventListener('pointermove', (e) => {
    cam.lastInput = performance.now();
    if (cam.drag) {
      const dx = e.clientX - px, dy = e.clientY - py;
      px = e.clientX; py = e.clientY;
      moved += Math.abs(dx) + Math.abs(dy);
      cam.yaw -= dx * 0.005;
      cam.gpitch = clamp(cam.gpitch - dy * 0.004, 0.12, 1.35);
      if (Math.abs(dx) + Math.abs(dy) > 2) state.follow = false, document.body.classList.remove('follow');
    } else {
      const r = cv3.getBoundingClientRect();
      cam.hover = pickTrain(e.clientX - r.left, e.clientY - r.top);
      cv3.style.cursor = cam.hover ? 'pointer' : 'grab';
    }
  });
  const end = (e) => {
    if (!cam.drag) return;
    cam.drag = false;
    cv3.classList.remove('drag');
    if (moved < 6) {
      const r = cv3.getBoundingClientRect();
      const hit = pickTrain(e.clientX - r.left, e.clientY - r.top);
      if (hit) selectTrain(hit);
      else {
        const st = pickStation(e.clientX - r.left, e.clientY - r.top);
        if (st) { cam.gx = w3x(STN[st].x); cam.gz = w3z(STN[st].y); cam.gdist = Math.min(cam.dist, 620); }
      }
    }
  };
  cv3.addEventListener('pointerup', end);
  cv3.addEventListener('pointercancel', () => { cam.drag = false; cv3.classList.remove('drag'); });
  cv3.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.lastInput = performance.now();
    cam.gdist = clamp(cam.gdist * (1 + (e.deltaY > 0 ? 0.12 : -0.12)), 190, 2400);
  }, { passive: false });
  cv3.addEventListener('dblclick', resetCam);
}
function pickTrain(x, y) {
  let best = null, bd = 22;
  (cam.screen || []).forEach((p) => {
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < bd) { bd = d; best = p.id; }
  });
  return best;
}
function pickStation(x, y) {
  let best = null, bd = 24;
  Object.keys(STN).forEach((id) => {
    const p = project(w3x(STN[id].x), 10, w3z(STN[id].y));
    if (!p) return;
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < bd) { bd = d; best = id; }
  });
  return best;
}
function resetCam() {
  cam.yaw = CAM_DEFAULT.yaw;
  cam.gpitch = CAM_DEFAULT.pitch;
  cam.gdist = CAM_DEFAULT.dist;
  cam.gx = 0; cam.gz = 0;
  state.follow = false;
  document.body.classList.remove('follow');
  cam.lastInput = performance.now();
}
function toggleFollow() {
  state.follow = !state.follow;
  document.body.classList.toggle('follow', state.follow);
  if (state.follow) { setView('3d'); cam.lastInput = performance.now(); }
  else { cam.gdist = 900; cam.gpitch = 0.58; }
}
function setView(v) {
  state.view = v;
  document.body.classList.toggle('view3d', v === '3d');
  cv3.classList.toggle('on', v === '3d');
  $('#view2d').classList.toggle('on', v === '2d');
  $('#view3d').classList.toggle('on', v === '3d');
  if (v === '2d') { state.follow = false; document.body.classList.remove('follow'); }
  cam.lastInput = performance.now();
}

/* ======================================================================
   16. START-UP
   ====================================================================== */
function init() {
  buildMap();
  buildLineStatus();
  buildSubsystems();
  buildTrainList();
  buildStats();
  buildLineLoad();

  // pre-fill charts so they look busy from the first second
  for (let i = 0; i < 60; i++) {
    sim.flow = walk(sim.flow, 140, 4300, 2200, 6400);
    sim.flowHist.push(sim.flow);
    sim.energyHist.push(5.4 + Math.sin(i / 6) * 0.35 + rand(-0.12, 0.12));
  }
  sim.pax = trains.reduce((a, x) => a + x.load / 100 * 1800, 0);
  sim.energy = sim.energyHist[59];

  // controls
  $('#langEn').addEventListener('click', () => setLang('en'));
  $('#langZh').addEventListener('click', () => setLang('zh'));
  $('#view2d').addEventListener('click', () => setView('2d'));
  $('#view3d').addEventListener('click', () => setView('3d'));
  setup3D();
  $('#btnScene').addEventListener('click', () => toggleScene());
  $('#btnPause').addEventListener('click', togglePause);
  $('#btnEmg').addEventListener('click', toggleEmergency);
  $('#btnFull').addEventListener('click', toggleFull);
  document.addEventListener('fullscreenchange', updateButtons);
  document.addEventListener('webkitfullscreenchange', updateButtons);
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'f') toggleFull();
    else if (k === 'p') togglePause();
    else if (k === 'e') toggleEmergency();
    else if (k === 'l') setLang(lang === 'en' ? 'zh' : 'en');
    else if (k === 'n') selectNextTrain();
    else if (k === 's') toggleScene();
    else if (k === 'm') setView(state.view === '3d' ? '2d' : '3d');
    else if (k === 'z') toggleFollow();
    else if (k === 'r') resetCam();
    else if (k === 'escape') { if (document.body.classList.contains('scene')) toggleScene(false); }
    else if (k === '0') setFilter('ALL');
    else if (/^[1-4]$/.test(k)) setFilter(LINES[Number(k) - 1].id);
    else if (/^[5-8]$/.test(k)) setBeat(Number(k) - 4);
    else if (k === '9') setBeat(0);
    else if (k === '.' || k === '>') nextBeat();
  });
  window.addEventListener('resize', drawCharts);

  addAlert('info', 'online');
  addAlert('info', 'signal', { n: 212 });
  addAlert('info', 'substation', { n: 7, v: 64 });

  applyLang();
  setView(state.view);
  setupAutoScroll();
  selectTrain(state.selected);
  simReady = true;

  // animation loop — smooth train movement
  let last = performance.now();
  let detailTimer = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (!state.paused) stepTrains(dt);
    if (state.view === '3d') render3D(dt); else renderTrains();
    detailTimer += dt;
    if (detailTimer > 0.25) { detailTimer = 0; renderDetail(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // data loop — once per second
  setInterval(() => {
    if (!state.paused) simulateSecond();
    refreshAll();
  }, 1000);

  // clock keeps real time even while paused
  setInterval(updateClock, 250);
}

init();
})();
</script>
